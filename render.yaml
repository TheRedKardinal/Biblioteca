# Blueprint Render: backend + frontend.
# Su Render: New > Blueprint > repository > Apply.
# Rinominare app-be / app-fe con il nome del progetto.
#
# Il database NON viene creato qui: il piano free ne consente uno solo per account
# e si usa quello gia' esistente. Le tabelle stanno nello schema "biblioteca",
# separate da quelle dell'altro progetto.

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: app-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: be
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - be/**
        - render.yaml
    envVars:
      # Connection string del database esistente (Internal Database URL se e' nella
      # stessa regione del servizio, altrimenti External Database URL)
      - key: DATABASE_URL
        sync: false
      # Schema dedicato: le tabelle non si mescolano con quelle dell'altro progetto
      - key: DB_SCHEMA
        value: biblioteca
      # Origine del FE per il CORS, es. https://app-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Firma dei JWT (HS256, >= 32 byte): Render genera un valore casuale.
      - key: JWT_SECRET
        generateValue: true
      # Credenziali del SuperUser creato all'avvio da DataInitializer.
      - key: SUPERUSER_EMAIL
        sync: false
      - key: SUPERUSER_PASSWORD
        sync: false

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: app-fe
    runtime: static
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - fe/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://app-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
